<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Portfolio Cover</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            background: #f2f1ee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .frame {
            position: relative;
            width: 530px;
            height: 690px;
            border: 1.5px solid #1a1a1a;
            opacity: 0;
            animation: frameIn 0.9s ease-out 0.1s forwards;
        }

        .year {
            position: absolute;
            top: 118px;
            left: 118px;
            font-size: 19px;
            color: #1a1a1a;
            letter-spacing: 0.5px;
            opacity: 0;
            z-index: 2;
            animation: fadeUp 0.7s ease-out 0.6s forwards;
        }

        .title {
            position: absolute;
            top: 184px;
            left: 40px;
            right: 40px;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 48px;
            line-height: 1;
            color: #FFD400;
            text-shadow: -1px -1px 0 #1a1a1a, 1px -1px 0 #1a1a1a, -1px 1px 0 #1a1a1a, 1px 1px 0 #1a1a1a;
            z-index: 1;
            letter-spacing: 4px;
            text-transform: lowercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 120px;
        }

        .title span em {
            font-style: normal;
            animation: fadeUp 0.7s ease-out forwards;
            opacity: 0;
        }

        .title .l1 em {
            animation-delay: 0.8s;
        }

        .title .l2 em {
            animation-delay: 1.0s;
        }

        .name {
            position: absolute;
            bottom: 78px;
            left: 108px;
            right: 108px;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            font-size: 30px;
            color: #1a1a1a;
            opacity: 0;
            z-index: 6;
            animation: fadeUp 0.7s ease-out 1.7s forwards;
        }

        @keyframes frameIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes riseUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .sticker {
            position: absolute;
            left: 50%;
            top: 38%;
            transform: translate(-50%, -40%) scale(.95);
            width: 440px;
            height: auto;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            animation: stickerIn .8s cubic-bezier(.22, 1, .36, 1) 1.9s forwards;
        }

        @keyframes stickerIn {
            from {
                opacity: 0;
                transform: translate(-50%, -30%) scale(.85);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -40%) scale(.95);
            }
        }
        .arrow-btn {
            position: absolute;
            bottom: 28px;
            left: 40%;
            transform: translateX(-50%);
            cursor: pointer;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 2.5s forwards;
            z-index: 10;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 22px;
            border: 1.5px solid #1a1a1a;
            border-radius: 40px;
            background: transparent;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #1a1a1a;
            letter-spacing: 0.5px;
            transition: all 0.4s cubic-bezier(.22,1,.36,1);
        }

        .arrow-btn .btn-icon {
            display: inline-flex;
            opacity: 0;
            transform: translateX(-6px);
            transition: all 0.4s cubic-bezier(.22,1,.36,1);
        }

        .arrow-btn:hover {
            background: #1a1a1a;
            color: #f2f1ee;
            padding-right: 18px;
        }

        .arrow-btn:hover .btn-icon {
            opacity: 1;
            transform: translateX(0);
        }

        .arrow-btn svg {
            width: 14px;
            height: 14px;
            stroke: #f2f1ee;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>

<body>
    <div class="frame">
        <div class="year">2026'</div>
        <div class="title">
            <span class="l1"><em>port</em></span>
            <span class="l2"><em>folio</em></span>
        </div>
        <img class="sticker" src="sticker_high_res.png" alt="Character sticker">
        <div class="name">Rishabh Kothiyal</div>
        <a href="About.html" class="arrow-btn">
            <span>About me</span>
            <span class="btn-icon">
                <svg viewBox="0 0 24 24">
                    <polyline points="9 6 15 12 9 18"/>
                </svg>
            </span>
        </a>
    </div>


    <script src="router.js"></script>
    <script src="nav-manager.js"></script>
    <script src="player.js"></script>
</body>

</html>
